# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# License policy for the gait dependency graph. gait itself is AGPL-3.0-or-later;
# every third-party dependency must be under a permissive license that is
# compatible with redistribution under the AGPL. Run `cargo deny check licenses`.

[licenses]
# SPDX identifiers explicitly permitted in the dependency tree. All entries below
# are permissive / AGPLv3-compatible. AGPL-3.0-or-later is gait's own license.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

# qtpi-bonding git crates declare no licence (gp decision 2026-10-24).
# Narrow on purpose: these exact crates only, each clarified to a LicenseRef
# that is allowed for that crate alone. Nothing new is added to `allow` above.
# To drop an entry, delete both its clarify and its exception when the crate
# gains a licence field upstream.
[[licenses.clarify]]
crate = "identity-crypto"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "identity-keyfile"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "message-attestation"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "coded-error"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "coded-error-derive"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "concord-telemetry"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "concord-telemetry-derive"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.clarify]]
crate = "concord-telemetry-proto"
expression = "LicenseRef-qtpi-unlicensed"
license-files = []

[[licenses.exceptions]]
crate = "identity-crypto"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "identity-keyfile"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "message-attestation"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "coded-error"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "coded-error-derive"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "concord-telemetry"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "concord-telemetry-derive"
allow = ["LicenseRef-qtpi-unlicensed"]

[[licenses.exceptions]]
crate = "concord-telemetry-proto"
allow = ["LicenseRef-qtpi-unlicensed"]
