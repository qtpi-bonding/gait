[package]
name = "gait-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", features = ["json", "stream"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
futures-util       = "0.3"
tokio-stream       = "0.1"
async-openai       = "0.28"
thiserror          = "1"
eventsource-stream = "0.2"
async-stream       = "0.3"
async-trait        = "0.1"
anyhow             = "1"

[dev-dependencies]
tokio-test = "0.4"
