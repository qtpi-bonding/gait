[workspace]
resolver = "2"
members = ["crates/gait-bin", "crates/gait-repl", "crates/gait-cli", "crates/gait-proto", "crates/gait-types", "crates/gait-provider", "crates/gait-workflow", "crates/gait-ops", "crates/gait-mangen", "crates/gait-sandbox", "crates/gait-state", "crates/gait-acp"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/qtpi-bonding/gait"

# Full debug info + macOS's split-debuginfo=unpacked means every one of this
# workspace's ~57 test binaries pays a real dSYM-generation cost at link time.
# Debug info isn't needed for `cargo test`'s pass/fail output, so drop it here
# (use `-C debuginfo` overrides locally if you need a debugger against a
# specific test binary). Modest win on its own — the bigger levers for a slow
# `cargo test --workspace` are (a) paying the dependency-compile cost once
# and (b) NOT alternating between `--workspace`, `-p <crate>`, and `--test
# <name>` invocations across commands, which forces spurious relinks of
# gait-core/gait-workflow (measured ~36s each time) even with no source
# changes, because Cargo's per-invocation unit-graph fingerprint differs.
[profile.test]
debug = 0

[package]
name = "gait-core"
description = "Core turn engine, tools, and providers for gait — a turn-based, git-native AI coding agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap               = { version = "4", features = ["derive"] }
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
serde_yaml          = "0.9"
futures-util       = "0.3"
rand               = "0.8"
tokio-stream       = "0.1"
tokio-util         = "0.7"
thiserror          = "1"
eventsource-stream = "0.2"
async-stream       = "0.3"
async-trait        = "0.1"
anyhow             = "1"
schemars = { version = "0.8", features = ["derive"] }
glob = "0.3"
ignore = "0.4"
walkdir = "2"
regex = "1"
similar = "2"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
libc = "0.2"
fs2  = "0.4"
rmcp = { version = "1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
portable-pty = "0.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
gait-types     = { path = "crates/gait-types" }
gait-provider   = { path = "crates/gait-provider" }
gait-sandbox    = { path = "crates/gait-sandbox" }
gait-proto      = { path = "crates/gait-proto" }
gait-state      = { path = "crates/gait-state" }
prost          = "0.13"
pbjson-types   = "0.7"
# content_hash pipeline: SHA-256 over JCS(RFC 8785) of the canonical body JSON.
serde_jcs      = "0.1"
jsonschema     = { version = "0.18", default-features = false }
tempfile       = "3"

[features]
testing = []

[dev-dependencies]
tempfile = "3"
serial_test = "3"
gait-workflow = { path = "crates/gait-workflow" }
# gait-core's test helpers (e.g. `git::checkpoint::MockCheckpointRepo`) live in
# gait-state behind `feature = "testing"`; enable it for the test build only.
gait-state = { path = "crates/gait-state", features = ["testing"] }

[[bin]]
name = "mock_brain"
path = "src/bin/mock_brain.rs"
