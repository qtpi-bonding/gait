[package]
name = "gait-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", features = ["json", "stream"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml          = "0.9"
futures-util       = "0.3"
tokio-stream       = "0.1"
thiserror          = "1"
eventsource-stream = "0.2"
async-stream       = "0.3"
async-trait        = "0.1"
anyhow             = "1"
schemars = { version = "0.8", features = ["derive"] }
glob = "0.3"
walkdir = "2"
regex = "1"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
libc = "0.2"
termimad  = "0.23"
rustyline = "14"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
