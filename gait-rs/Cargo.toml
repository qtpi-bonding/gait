[workspace]
resolver = "2"
members = ["crates/gait-bin", "crates/gait-repl", "crates/gait-cli", "crates/gait-proto", "crates/gait-types", "crates/gait-platform", "crates/gait-auth", "crates/gait-provider", "crates/gait-local", "crates/gait-llama-cpp", "crates/gait-workflow", "crates/gait-turn-runner", "crates/gait-ops", "crates/gait-sandbox", "crates/gait-state", "crates/gait-acp", "crates/gait-events", "crates/gait-identity", "crates/gait-testkit", "crates/gait-watch", "crates/gait-codemode", "crates/gait-codemode-js", "xtask"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/qtpi-bonding/gait"

# One pin per shared library: a bump edits this table, not every manifest.
# Members add features and `optional`; `coded-error` has its default features
# off here because an inheriting member can add features but not remove them
# (gait-local and gait-watch need them off), so a member that wants `anyhow`
# lists it.
[workspace.dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "de21d22e31baff78eae7d4ca817b87430bff1f81", default-features = false }
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "5fa9743260a1ad007eb5c417c4a24a3f95d5fd1c" }
concord-telemetry-proto = { git = "https://github.com/qtpi-bonding/concord-telemetry-proto.git", rev = "2c696ccd91396879ca8025ef9e8992126c5cfcee" }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "b4b3da5d857e0311798e843f433d9177ca7f7c7a" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "b4b3da5d857e0311798e843f433d9177ca7f7c7a" }
message-attestation = { git = "https://github.com/qtpi-bonding/message-attestation.git", rev = "b2008d828100b81525a0bc4d85a0a2d3c8c8c9d2" }
op-registry = { git = "https://github.com/qtpi-bonding/op-registry.git", rev = "71516054e828d5f2ba09d50c964f8f48d89c81d2", default-features = false, features = ["manual"] }

# Full debug info + macOS's split-debuginfo=unpacked means every one of this
# workspace's ~57 test binaries pays a real dSYM-generation cost at link time.
# Debug info isn't needed for `cargo test`'s pass/fail output, so drop it here
# (use `-C debuginfo` overrides locally if you need a debugger against a
# specific test binary). Modest win on its own — the bigger levers for a slow
# `cargo test --workspace` are (a) paying the dependency-compile cost once
# and (b) NOT alternating between `--workspace`, `-p <crate>`, and `--test
# <name>` invocations across commands, which forces spurious relinks of
# gait-core/gait-workflow (measured ~36s each time) even with no source
# changes, because Cargo's per-invocation unit-graph fingerprint differs.
[profile.test]
debug = 0

[package]
name = "gait-core"
description = "Core turn engine, tools, and providers for gait — a turn-based, git-native AI coding agent."
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap               = { version = "4", features = ["derive"] }
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
serde_yaml          = "0.9"
futures-util       = "0.3"
rand               = "0.8"
tokio-stream       = "0.1"
tokio-util         = "0.7"
thiserror          = "1"
coded-error        = { workspace = true, features = ["anyhow"] }
concord-telemetry  = { workspace = true, optional = true }
tracing            = { version = "0.1", optional = true }
eventsource-stream = "0.2"
async-stream       = "0.3"
async-trait        = "0.1"
anyhow             = "1"
schemars = { version = "0.8", features = ["derive"] }
glob = "0.3"
ignore = "0.4"
walkdir = "2"
regex = "1"
similar = "2"
git2 = "0.20"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2  = "0.4"
rmcp = { version = "1", optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
portable-pty = "0.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
gait-types     = { path = "crates/gait-types" }
gait-provider   = { path = "crates/gait-provider" }
gait-auth       = { path = "crates/gait-auth" }
gait-sandbox    = { path = "crates/gait-sandbox" }
gait-proto      = { path = "crates/gait-proto" }
gait-identity   = { path = "crates/gait-identity" }
gait-state      = { path = "crates/gait-state" }
gait-ops        = { path = "crates/gait-ops" }
gait-events     = { path = "crates/gait-events", optional = true }
gait-codemode   = { path = "crates/gait-codemode", optional = true }
prost          = "0.13"
pbjson-types   = "0.7"
prost-types    = "0.13"
# content_hash pipeline: SHA-256 over JCS(RFC 8785) of the canonical body JSON.
serde_jcs      = "0.1"
jsonschema     = { version = "0.18", default-features = false }
tempfile       = "3"
base64         = "0.22"
hex            = "0.4"
identity-crypto = { workspace = true }
message-attestation = { workspace = true }

[features]
testing = []
telemetry = ["dep:concord-telemetry", "dep:gait-events", "dep:tracing", "gait-ops/telemetry", "gait-provider/telemetry", "gait-state/telemetry"]
local = ["gait-provider/local-native"]
# `gait-bin`'s `full`/`min` composition (Task 5). `min` itself is a no-op here
# — it only exists so `cargo test -p gait-core --features min` resolves when
# testing this crate directly; `gait-bin`'s own `min = [..., "gait-core/min"]`
# (deliberately) doesn't turn `mcp`/`code-mode` on. `mcp` makes `rmcp` (the
# live MCP client, `src/mcp/client.rs`) and `ResolvedProfile.mcp_clients`
# real; `code-mode` makes `gait-codemode` (and therefore `wasmtime`/
# `cranelift`) a real dependency — its call sites (`src/tools/code.rs`,
# `src/turn/spine/handlers/output.rs`) are gated in Task 6b/6c, not here.
mcp = ["dep:rmcp"]
code-mode = ["dep:gait-codemode"]
min = []

[dev-dependencies]
tempfile = "3"
serial_test = "3"
identity-keyfile = { workspace = true, features = ["testkit"] }
gait-workflow = { path = "crates/gait-workflow" }
gait-ops = { path = "crates/gait-ops" }
gait-auth = { path = "crates/gait-auth", features = ["testing"] }
# gait-core's test helpers (e.g. `git::checkpoint::MockCheckpointRepo`) live in
# gait-state behind `feature = "testing"`; enable it for the test build only.
gait-state = { path = "crates/gait-state", features = ["testing"] }
gait-repl = { path = "crates/gait-repl", features = ["dev-harness"] }
concord-telemetry = { workspace = true, features = ["testing"] }

[[bin]]
name = "mock_brain"
path = "src/bin/mock_brain.rs"

# All integration tests that share no process-global state are modules of this
# one program (tests/main.rs).
[[test]]
name = "tests"
path = "tests/main.rs"

# Separate: sets the process-global env GAIT_BRAIN_EXE (set_var).
[[test]]
name = "repl_live_render"
path = "tests/repl_live_render.rs"

# Separate: sets the process-global env MINIMAX_API_KEY (set_var).
[[test]]
name = "integration_workflow"
path = "tests/integration_workflow.rs"

# Separate: sets the process-global env GAIT_TEST_WATCHDOG_MS (set_var).
[[test]]
name = "spine_watchdog"
path = "tests/spine_watchdog.rs"

# Separate: installs the process-global telemetry subscriber (one init per process).
[[test]]
name = "telemetry_flush"
path = "tests/telemetry_flush.rs"

# Separate: installs the process-global telemetry subscriber (one init per process).
[[test]]
name = "telemetry_flush_down"
path = "tests/telemetry_flush_down.rs"

# Separate: the global telemetry subscriber; its init-failure case needs a fresh process.
[[test]]
name = "telemetry_init_failed"
path = "tests/telemetry_init_failed.rs"

# Separate: seals the whole process (ignored tests, run alone with --test-threads=1).
[[test]]
name = "landlock_seal"
path = "tests/landlock_seal.rs"

# Separate: seals the whole process (ignored tests, run alone with --test-threads=1).
[[test]]
name = "seatbelt_seal"
path = "tests/seatbelt_seal.rs"
