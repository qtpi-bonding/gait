[package]
name = "gait-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml          = "0.9"
futures-util       = "0.3"
tokio-stream       = "0.1"
thiserror          = "1"
eventsource-stream = "0.2"
async-stream       = "0.3"
async-trait        = "0.1"
anyhow             = "1"
schemars = { version = "0.8", features = ["derive"] }
glob = "0.3"
walkdir = "2"
regex = "1"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
termbg = "0.5"
libc = "0.2"
termimad  = "0.23"
rustyline = "14"
rmcp = { version = "1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
portable-pty = "0.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
# proto log format (source of truth: proto/*.proto). JSON wire via pbjson.
prost          = "0.13"
prost-types    = "0.13"
pbjson         = "0.7"
pbjson-types   = "0.7"
# content_hash pipeline: SHA-256 over JCS(RFC 8785) of the canonical body JSON.
sha2           = "0.10"
serde_jcs      = "0.1"
hex            = "0.4"

[build-dependencies]
prost-build         = "0.13"
pbjson-build        = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
