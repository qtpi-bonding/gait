[package]
name = "gait-workflow"
description = "YAML DAG workflow runner for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core  = { path = "../.." }
gait-proto = { path = "../gait-proto" }
git2       = "0.19"
tokio      = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
futures-util = "0.3"
regex = "1"
jsonschema = { version = "0.18", default-features = false }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"


[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["full", "test-util"] }
