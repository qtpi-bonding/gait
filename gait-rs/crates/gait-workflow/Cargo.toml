[package]
name = "gait-workflow"
description = "YAML DAG workflow runner for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core        = { path = "../.." }
gait-proto       = { path = "../gait-proto" }
gait-turn-runner = { path = "../gait-turn-runner" }
git2       = "0.20"
tokio      = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
futures-util = "0.3"
regex = "1"
jsonschema = { version = "0.18", default-features = false }
schemars   = { version = "0.8", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
thiserror = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753" }


[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["full", "test-util"] }
