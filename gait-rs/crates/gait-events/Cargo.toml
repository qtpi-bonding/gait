[package]
name = "gait-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa" }
prost = "0.13"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
concord-telemetry-proto = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa" }
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa", features = ["testing"] }
