[package]
name = "gait-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "2f150d8f8a67604ace6f6b6c33678ea57ecbd979" }
prost = "0.13"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
concord-telemetry-proto = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "2f150d8f8a67604ace6f6b6c33678ea57ecbd979" }
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "2f150d8f8a67604ace6f6b6c33678ea57ecbd979", features = ["testing"] }
