[package]
name = "gait-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-state = { path = "../gait-state" }
notify = "6"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753", default-features = false }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
