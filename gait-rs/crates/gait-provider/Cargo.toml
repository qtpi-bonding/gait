[package]
name = "gait-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
local = ["dep:gait-local"]
local-native = ["local", "dep:gait-llama-cpp", "gait-llama-cpp/native"]

[dependencies]
gait-types        = { path = "../gait-types" }
gait-auth         = { path = "../gait-auth" }
reqwest           = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio             = { version = "1", features = ["full"] }
tokio-util        = "0.7"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
futures-util      = "0.3"
eventsource-stream = "0.2"
anyhow            = "1"
thiserror         = "1"
async-trait       = "0.1"
async-stream      = "0.3"
rand              = "0.8"
gait-local        = { path = "../gait-local", optional = true }
gait-llama-cpp    = { path = "../gait-llama-cpp", optional = true }

[dev-dependencies]
tokio             = { version = "1", features = ["test-util"] }
