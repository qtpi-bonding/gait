[package]
name = "gait-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
telemetry = ["dep:concord-telemetry", "dep:gait-events", "dep:tracing"]
local = ["dep:gait-local"]
local-native = ["local", "dep:gait-llama-cpp", "gait-llama-cpp/native"]

[dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa", optional = true }
gait-events = { path = "../gait-events", optional = true }
tracing = { version = "0.1", optional = true }
gait-types        = { path = "../gait-types" }
gait-auth         = { path = "../gait-auth" }
reqwest           = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio             = { version = "1", features = ["full"] }
tokio-util        = "0.7"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
futures-util      = "0.3"
eventsource-stream = "0.2"
anyhow            = "1"
thiserror         = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d" }
async-trait       = "0.1"
async-stream      = "0.3"
rand              = "0.8"
gait-local        = { path = "../gait-local", optional = true }
gait-llama-cpp    = { path = "../gait-llama-cpp", optional = true }

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa", features = ["testing"] }
gait-events = { path = "../gait-events" }
tokio             = { version = "1", features = ["test-util"] }
