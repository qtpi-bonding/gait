[package]
name = "gait-bin"
description = "The gait command-line binary — a turn-based, git-native AI coding agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gait"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "gait-min"
path = "src/min_main.rs"
required-features = ["min"]

[lib]
name = "gait_bin"
path = "src/lib.rs"

[features]
default = ["full"]
# Today's full `gait` binary: the themed rich-TUI REPL, the real `gait
# workflow`/`/workflow` YAML DAG runner, and gait-core's optional MCP client
# / code-mode surfaces. Deliberately does NOT include `local` — see the
# round-7 correction below.
full = [
    "workflow", "rich-tui",
    "gait-core/mcp", "gait-core/code-mode",
]
# `gait-min`'s composition: no rich-TUI renderer, no `gait-workflow`
# dependency, no gait-core MCP/code-mode. Empty by design — Min's behavior
# comes from what is *not* enabled elsewhere, not from anything this feature
# itself turns on.
min = []
# `gait workflow` / REPL `/workflow` (real YAML DAG runs). Forwards into
# `gait-cli`'s and `gait-repl`'s own `workflow` features, which gate
# `dep:gait-workflow` there.
workflow = ["dep:gait-workflow", "gait-cli/workflow", "gait-repl/workflow"]
# The themed full-`gait` terminal REPL renderer (markdown, syntax
# highlighting, background-color detection). See gait-repl/Cargo.toml.
rich-tui = ["gait-repl/rich-tui"]
# Local-model management (`gait local ...`) and the in-process llama.cpp
# runner. Off by default in both `gait` and `gait-min` — builds llama.cpp
# from source (`gait-llama-cpp/native`), so it stays an explicit opt-in
# rather than riding along with `full`:
# `cargo build -p gait-bin --features full,local` for a full+local build.
local = [
    "gait-core/local",
    "gait-cli/local",
    "dep:gait-llama-cpp",
    "gait-llama-cpp/native",
]

[dependencies]
gait-core = { path = "../.." }
gait-llama-cpp = { path = "../gait-llama-cpp", optional = true }
gait-workflow = { path = "../gait-workflow", optional = true }
gait-repl = { path = "../gait-repl", default-features = false }
gait-cli = { path = "../gait-cli", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
git2 = "0.20"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
prost        = "0.13"
gait-proto   = { path = "../gait-proto" }
gait-state   = { path = "../gait-state" }
pbjson-types = "0.7"
