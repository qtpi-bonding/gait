[package]
name = "gait-bin"
description = "The gait command-line binary — a turn-based, git-native AI coding agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gait"
path = "src/main.rs"

[dependencies]
gait-core = { path = "../.." }
gait-repl = { path = "../gait-repl" }
gait-cli = { path = "../gait-cli" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
