[package]
name = "gait-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-types     = { path = "../gait-types" }
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
libc           = "0.2"
anyhow         = "1"
thiserror      = "1"
dirs-next      = "2"
glob           = "0.3"

[dev-dependencies]
tempfile = "3"
