[package]
name = "gait-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-types     = { path = "../gait-types" }
gait-platform  = { path = "../gait-platform" }
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
libc           = "0.2"
anyhow         = "1"
thiserror      = "1"
coded-error    = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "82f3158e8ea53af5449d3614ebfa6290688cf83e" }
glob           = "0.3"

[dev-dependencies]
tempfile = "3"
