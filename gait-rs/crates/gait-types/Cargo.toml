[package]
name = "gait-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-proto = { path = "../gait-proto" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars   = { version = "0.8", features = ["derive"] }
thiserror  = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d" }
anyhow     = "1"
async-trait = "0.1"

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
tempfile = "3"