[package]
name = "gait-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-proto = { path = "../gait-proto" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror  = "1"
anyhow     = "1"
async-trait = "0.1"
identity-crypto = { git = "ssh://git@github-qtpi-bonding-identity-crypto/qtpi-bonding/identity-crypto.git", rev = "f09e99b" }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
tempfile = "3"