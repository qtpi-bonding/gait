[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
gait-core = { path = "../.." }
gait-workflow = { path = "../gait-workflow" }
agent-client-protocol = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[[bin]]
name = "mock_brain_acp"
path = "../../src/bin/mock_brain.rs"

[dev-dependencies]
tempfile = "3"
gait-proto = { path = "../gait-proto" }
prost = "0.13"
