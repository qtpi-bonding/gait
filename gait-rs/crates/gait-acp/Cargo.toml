[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
gait-core = { path = "../..", features = ["mcp", "code-mode", "telemetry"] }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-ops = { path = "../gait-ops" }
gait-state = { path = "../gait-state" }
gait-identity = { path = "../gait-identity" }
gait-proto = { path = "../gait-proto" }
gait-events = { path = "../gait-events" }
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "bd4a62ccf3d4f48884a58babdd75f0e8c53d0d17" }
tracing = "0.1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d", features = ["cli", "acp"] }
thiserror = "1"
agent-client-protocol = { version = "1.1", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "signal"] }
tokio-util = "0.7"
anyhow = "1"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784" }
message-attestation = { git = "https://github.com/qtpi-bonding/message-attestation.git", rev = "2c7f1ff037aa02c2e850a7aa4d7422304d139737" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
gait-testkit = { path = "../gait-testkit" }

[[bin]]
name = "mock_brain_acp"
path = "src/bin/mock_brain_acp.rs"

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "bd4a62ccf3d4f48884a58babdd75f0e8c53d0d17", features = ["testing"] }
tempfile = "3"
gait-proto = { path = "../gait-proto" }
git2 = "0.20"
pbjson-types = "0.7"
prost = "0.13"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784", features = ["testkit"] }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784", features = ["testkit"] }
