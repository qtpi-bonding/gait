[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
gait-core = { path = "../.." }
gait-workflow = { path = "../gait-workflow" }
gait-ops = { path = "../gait-ops" }
gait-state = { path = "../gait-state" }
agent-client-protocol = { version = "1.1", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tokio-util = "0.7"
anyhow = "1"
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
gait-testkit = { path = "../gait-testkit" }

[[bin]]
name = "mock_brain_acp"
path = "src/bin/mock_brain_acp.rs"

[dev-dependencies]
tempfile = "3"
gait-proto = { path = "../gait-proto" }
gait-identity = { path = "../gait-identity" }
prost = "0.13"
git2 = "0.20"
pbjson-types = "0.7"
