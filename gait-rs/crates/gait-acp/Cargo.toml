[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
# Only the tests listed in the [[test]] targets at the end of this file are
# built.
autotests = false

[dependencies]
gait-core = { path = "../..", features = ["mcp", "code-mode", "telemetry"] }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-ops = { path = "../gait-ops" }
gait-state = { path = "../gait-state" }
gait-identity = { path = "../gait-identity" }
gait-proto = { path = "../gait-proto" }
gait-events = { path = "../gait-events" }
concord-telemetry = { workspace = true }
tracing = "0.1"
coded-error = { workspace = true, features = ["cli", "acp", "anyhow"] }
thiserror = "1"
agent-client-protocol = { version = "1.1", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "signal"] }
tokio-util = "0.7"
anyhow = "1"
identity-crypto = { workspace = true }
identity-keyfile = { workspace = true }
message-attestation = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
gait-testkit = { path = "../gait-testkit" }

[[bin]]
name = "mock_brain_acp"
path = "src/bin/mock_brain_acp.rs"

[dev-dependencies]
concord-telemetry = { workspace = true, features = ["testing"] }
tempfile = "3"
gait-proto = { path = "../gait-proto" }
git2 = "0.20"
pbjson-types = "0.7"
prost = "0.13"
identity-crypto = { workspace = true, features = ["testkit"] }
identity-keyfile = { workspace = true, features = ["testkit"] }

# All gait-acp integration tests that share no process-global state are
# modules of this one program (tests/main.rs): one binary instead of many
# means one dependency compile and one link.
[[test]]
name = "tests"
path = "tests/main.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# via set_var.
[[test]]
name = "cancel"
path = "tests/cancel.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# via set_var.
[[test]]
name = "clarify_inform_unlock"
path = "tests/clarify_inform_unlock.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# via set_var.
[[test]]
name = "fs_delegate"
path = "tests/fs_delegate.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# via set_var.
[[test]]
name = "permission"
path = "tests/permission.rs"

# Separate: sets the process-global env vars GAIT_HOME and GAIT_BRAIN_EXE
# via set_var.
[[test]]
name = "prompt"
path = "tests/prompt.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# via set_var.
[[test]]
name = "prompt_idempotency"
path = "tests/prompt_idempotency.rs"

# Separate: sets the process-global env vars GAIT_HOME and GAIT_BRAIN_EXE
# via set_var.
[[test]]
name = "prompt_provenance"
path = "tests/prompt_provenance.rs"

# Separate: sets the process-global env vars GAIT_HOME and GAIT_BRAIN_EXE
# via set_var.
[[test]]
name = "trace"
path = "tests/trace.rs"

# Separate: sets the process-global env vars GAIT_BRAIN_EXE and GAIT_HOME
# and sets/removes BAGGAGE via set_var.
[[test]]
name = "trace_carrier"
path = "tests/trace_carrier.rs"
