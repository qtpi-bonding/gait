[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
gait-core = { path = "../..", features = ["mcp", "code-mode", "telemetry"] }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-ops = { path = "../gait-ops" }
gait-state = { path = "../gait-state" }
gait-identity = { path = "../gait-identity" }
gait-proto = { path = "../gait-proto" }
gait-events = { path = "../gait-events" }
concord-telemetry = { workspace = true }
tracing = "0.1"
coded-error = { workspace = true, features = ["cli", "acp", "anyhow"] }
thiserror = "1"
agent-client-protocol = { version = "1.1", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "signal"] }
tokio-util = "0.7"
anyhow = "1"
identity-crypto = { workspace = true }
identity-keyfile = { workspace = true }
message-attestation = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
gait-testkit = { path = "../gait-testkit" }

[[bin]]
name = "mock_brain_acp"
path = "src/bin/mock_brain_acp.rs"

[dev-dependencies]
concord-telemetry = { workspace = true, features = ["testing"] }
tempfile = "3"
gait-proto = { path = "../gait-proto" }
git2 = "0.20"
pbjson-types = "0.7"
prost = "0.13"
identity-crypto = { workspace = true, features = ["testkit"] }
identity-keyfile = { workspace = true, features = ["testkit"] }
