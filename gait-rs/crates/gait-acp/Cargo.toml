[package]
name = "gait-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
gait-core = { path = "../..", features = ["mcp", "code-mode", "telemetry"] }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-ops = { path = "../gait-ops" }
gait-state = { path = "../gait-state" }
gait-identity = { path = "../gait-identity" }
gait-proto = { path = "../gait-proto" }
gait-events = { path = "../gait-events" }
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "a884cce4deb9a0c9baa8e5640519f93f78022668" }
tracing = "0.1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753", features = ["cli", "acp"] }
thiserror = "1"
agent-client-protocol = { version = "1.1", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "signal"] }
tokio-util = "0.7"
anyhow = "1"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681" }
message-attestation = { git = "https://github.com/qtpi-bonding/message-attestation.git", rev = "eb6248d1ff2d2b5b0c24e2796e1b7303c33c45fb" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
gait-testkit = { path = "../gait-testkit" }

[[bin]]
name = "mock_brain_acp"
path = "src/bin/mock_brain_acp.rs"

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "a884cce4deb9a0c9baa8e5640519f93f78022668", features = ["testing"] }
tempfile = "3"
gait-proto = { path = "../gait-proto" }
git2 = "0.20"
pbjson-types = "0.7"
prost = "0.13"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681", features = ["testkit"] }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681", features = ["testkit"] }
