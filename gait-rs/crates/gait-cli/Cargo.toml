[package]
name = "gait-cli"
description = "Command implementations for the gait CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core    = { path = "../.." }
gait-ops     = { path = "../gait-ops" }
gait-auth    = { path = "../gait-auth" }
gait-workflow = { path = "../gait-workflow" }
gait-proto   = { path = "../gait-proto" }
prost        = "0.13"
pbjson-types = "0.7"

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
jsonschema = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
git2 = "0.20"
serde_yaml = "0.9"
libc = "0.2"

[features]
default = []
local = ["dep:gait-local"]
dev-harness = []

[dependencies.gait-local]
path = "../gait-local"
optional = true

[[bin]]
name = "mock_brain"
path = "../../src/bin/mock_brain.rs"
required-features = ["dev-harness"]

[dev-dependencies]
serial_test = "3"
tempfile    = "3"
gait-state    = { path = "../gait-state" }
