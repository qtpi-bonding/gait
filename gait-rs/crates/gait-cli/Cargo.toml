[package]
name = "gait-cli"
description = "Command implementations for the gait CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core    = { path = "../.." }
gait-ops     = { path = "../gait-ops" }
gait-auth    = { path = "../gait-auth" }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-proto   = { path = "../gait-proto" }
prost        = "0.13"
pbjson-types = "0.7"

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
jsonschema = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
git2 = "0.20"
serde_yaml = "0.9"
libc = "0.2"

[features]
default = ["workflow"]
local = ["dep:gait-local"]
dev-harness = []
# `gait workflow` subcommand (real YAML DAG runs). Ordinary CLI turns
# (`cli::run::cmd_run`) no longer need `gait-workflow` at all (Task 3) — only
# `cli::workflow` does. Default-on so today's full `gait` binary (which builds
# gait-cli with default features) is unaffected; a future minimal build can
# opt out.
workflow = ["dep:gait-workflow"]

[dependencies.gait-local]
path = "../gait-local"
optional = true

[dependencies.gait-workflow]
path = "../gait-workflow"
optional = true

[[bin]]
name = "mock_brain"
path = "../../src/bin/mock_brain.rs"
required-features = ["dev-harness"]

[dev-dependencies]
serial_test = "3"
tempfile    = "3"
gait-state    = { path = "../gait-state" }
