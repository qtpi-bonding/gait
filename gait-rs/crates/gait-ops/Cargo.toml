[package]
name = "gait-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d" }
gait-state = { path = "../gait-state" }
gait-auth = { path = "../gait-auth" }
gait-proto = { path = "../gait-proto" }
gait-events = { path = "../gait-events", optional = true }
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "d4dcd96ba0e17f60acd93ba5fda554dbd4ce0cc6", optional = true }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
git2 = "0.20"     # init's commit + undo's transcript git-walk
libc = "0.2"      # daemon::stop killpg(SIGTERM)
serde_yaml = "0.9"  # extension's frontmatter helpers

[features]
telemetry = ["dep:concord-telemetry", "dep:gait-events", "gait-state/telemetry"]

[dev-dependencies]
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "d4dcd96ba0e17f60acd93ba5fda554dbd4ce0cc6", features = ["testing"] }
tempfile = "3"
gait-auth = { path = "../gait-auth", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }  # models() async test
serial_test = "3"  # GAIT_DIR-env-var-safe tests (link round-trip)
