[package]
name = "gait-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core  = { path = "../.." }
gait-proto = { path = "../gait-proto" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
git2 = "0.19"     # init's commit + undo's transcript git-walk
libc = "0.2"      # daemon::stop killpg(SIGTERM)

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }  # models() async test
