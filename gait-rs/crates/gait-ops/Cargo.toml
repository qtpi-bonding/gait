[package]
name = "gait-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753" }
gait-state = { path = "../gait-state" }
gait-auth = { path = "../gait-auth" }
gait-proto = { path = "../gait-proto" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
git2 = "0.20"     # init's commit + undo's transcript git-walk
libc = "0.2"      # daemon::stop killpg(SIGTERM)
serde_yaml = "0.9"  # extension's frontmatter helpers

[dev-dependencies]
tempfile = "3"
gait-auth = { path = "../gait-auth", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }  # models() async test
serial_test = "3"  # GAIT_DIR-env-var-safe tests (link round-trip)
