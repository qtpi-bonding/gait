# Wall 2 (design §3): an op must never run a turn. These are ALL public turn
# entrypoints reachable through the gait-core dependency. gait-workflow's
# run_workflow/single_prompt_run are unreachable (not a dependency).
# The ban-list-completeness test (tests/ban_list_complete.rs) keeps this in sync.
disallowed-methods = [
    "gait_core::embed::run_loop",
    "gait_core::embed::run_one_off_turn",
    "gait_core::turn::run_turn",
    "gait_core::turn::brain::run_brain",
    "gait_core::turn::hand::run_hand",
]
