[package]
name = "gait-mangen"
description = "Man page generator for gait — derives pages from the live Cli definition."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gait-mangen"
path = "src/main.rs"

[dependencies]
gait-bin    = { path = "../gait-bin" }
gait-repl   = { path = "../gait-repl" }
clap        = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
sha2        = "0.10"
thiserror   = "1"
