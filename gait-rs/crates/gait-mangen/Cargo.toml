[package]
name = "gait-mangen"
description = "Man page generator for gait — derives pages from the live Cli definition."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gait-mangen"
path = "src/main.rs"

[dependencies]
gait-bin    = { path = "../gait-bin" }
clap        = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
