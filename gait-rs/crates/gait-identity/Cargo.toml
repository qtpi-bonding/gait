[package]
name = "gait-identity"
description = "Identity-keyfile glue for gait direct provenance."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { workspace = true, features = ["anyhow"] }
gait-proto = { path = "../gait-proto" }
identity-crypto = { workspace = true }
identity-keyfile = { workspace = true }
anyhow = "1"
thiserror = "1"
prost = "0.13"

[dev-dependencies]
tempfile = "3"
identity-crypto = { workspace = true, features = ["testkit"] }
identity-keyfile = { workspace = true, features = ["testkit"] }
