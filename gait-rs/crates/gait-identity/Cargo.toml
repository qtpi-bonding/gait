[package]
name = "gait-identity"
description = "Identity-keyfile glue for gait direct provenance."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753" }
gait-proto = { path = "../gait-proto" }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681" }
anyhow = "1"
thiserror = "1"
prost = "0.13"

[dev-dependencies]
tempfile = "3"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681", features = ["testkit"] }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "67737b3aeee80f5e9871d0c5f6d8c766c13e3681", features = ["testkit"] }
