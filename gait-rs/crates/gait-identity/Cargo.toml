[package]
name = "gait-identity"
description = "Identity-keyfile glue for gait direct provenance."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753" }
gait-proto = { path = "../gait-proto" }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "feb5d585a77c6ba45eedc16fd08c2bd7feeff782" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "feb5d585a77c6ba45eedc16fd08c2bd7feeff782" }
anyhow = "1"
thiserror = "1"
prost = "0.13"

[dev-dependencies]
tempfile = "3"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "feb5d585a77c6ba45eedc16fd08c2bd7feeff782", features = ["testkit"] }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "feb5d585a77c6ba45eedc16fd08c2bd7feeff782", features = ["testkit"] }
