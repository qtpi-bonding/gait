[package]
name = "gait-identity"
description = "Agent identity: pluggable signing schemes (Signer trait, KeyScheme dispatch, keyring)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-proto = { path = "../gait-proto" }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "f09e99b" }
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
