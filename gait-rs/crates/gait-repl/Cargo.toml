[package]
name = "gait-repl"
description = "Interactive REPL frontend for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core = { path = "../.." }
gait-workflow = { path = "../gait-workflow" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
glob = "0.3"
termimad = "0.34"
termbg = "0.5"
crossterm = "0.29"
tokio-util = "0.7"
reedline = "0.48"
unicode-width = "0.2"
nu-ansi-term = "0.50"

[dev-dependencies]
tempfile = "3"
pbjson-types = "0.7"