[package]
name = "gait-repl"
description = "Interactive REPL frontend for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core = { path = "../.." }
gait-ops = { path = "../gait-ops" }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-workflow = { path = "../gait-workflow", optional = true }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
glob = "0.3"
termimad = { version = "0.34", optional = true }
termbg = { version = "0.5", optional = true }
crossterm = "0.29"
syntect = { version = "5.2", optional = true, default-features = false, features = ["default-themes", "default-syntaxes", "parsing", "regex-fancy"] }
tokio-util = "0.7"
reedline = "0.48"
unicode-width = { version = "0.2", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
libc = { version = "0.2", optional = true }
prost = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
git2 = { version = "0.20", optional = true }
gait-testkit = { path = "../gait-testkit", optional = true }

[dev-dependencies]
tempfile = "3"
pbjson-types = "0.7"
serial_test = "3"

[features]
default = ["workflow", "rich-tui"]
# The themed full-`gait` terminal renderer: markdown (termimad), syntax
# highlighting (syntect), background-color detection (termbg), and the
# reedline highlighter's ANSI styling (nu-ansi-term) + its display-width
# math (unicode-width). `gait-min` builds without this feature and gets only
# the plain REPL (`plain.rs`) — streamed text on stdout/stderr, no ANSI
# rendering. `reedline`/`crossterm` stay unconditional: `reedline` pulls in
# `crossterm` transitively regardless of this feature (verified via `cargo
# tree -p gait-repl --no-default-features`), and the plain REPL still needs a
# real line editor.
#
# Implies `workflow`: `repl::driver` (the module this feature gates — see
# the `workflow` feature's doc comment below) references `gait_workflow::`
# unconditionally in `run_named_workflow`/its `/workflow` dispatch site, with
# no `#[cfg(feature = "workflow")]` of its own. Rather than adding that cfg
# (which would need extracting `/workflow` support into a `rich-tui`-
# independent module first — no consumer needs that split yet, see the
# `workflow` feature's doc comment), `rich-tui` simply declares the real
# dependency it already has: `rich-tui` on without `workflow` is not a
# buildable combination today, so don't advertise it as one. Both shipping
# compositions (`full` = both on, `min` = both off) are unaffected.
rich-tui = ["workflow", "dep:termimad", "dep:termbg", "dep:syntect", "dep:unicode-width", "dep:nu-ansi-term"]
# The `mock_brain` binary (a canned brain process for scripted turn tests)
# and its deps. Deliberately does NOT imply `rich-tui`: `mock_brain` itself
# only needs `gait-testkit`, so the plain REPL's own turn-engine tests can
# drive a real turn (via `gait_turn_runner::run_turn_source` + this binary)
# under `--features dev-harness` with `rich-tui` off. `src/dev_harness.rs`
# (the annotate/capture *rendering* harness `chat.rs`'s e2e test uses) is
# gated separately below on `all(dev-harness, rich-tui)`, since it drives the
# themed `ReplBuilder`/`ReplSource`/`ReplSink` stack directly.
dev-harness = ["dep:libc", "dep:prost", "dep:serde", "dep:tempfile", "dep:git2", "dep:gait-testkit"]
# `/workflow` REPL command (real YAML DAG runs). Ordinary REPL turns
# (`chat.rs`) no longer need `gait-workflow` at all (Task 3) — only
# `repl::driver::run_named_workflow` does. Default-on so today's full `gait`
# binary is unaffected; a future minimal build can opt out.
#
# `repl::driver::run_named_workflow` and its `/workflow` command dispatch
# site still reference `gait_workflow::` unconditionally — no
# `#[cfg(feature = "workflow")]` on them directly. That's fine because
# `repl::driver` (the *entire* module — it holds a `ui::ReplBuilder` field
# and calls `crate::theme::RESET` throughout) is gated on `rich-tui`, and
# `rich-tui` now declares `workflow` as an implied feature (see `rich-tui`'s
# doc comment above) precisely because of this coupling — so `rich-tui` can
# no longer be on with `workflow` off, and the unconditional `gait_workflow::`
# reference is always satisfied whenever `driver.rs` is reachable. The gap
# this leaves: a `workflow`-on + `rich-tui`-off build (real `/workflow` REPL
# support without the themed renderer) has no working `/workflow` command
# today — `plain.rs`'s `MIN_REPL_COMMANDS` doesn't even list it. If a future
# task wants `/workflow` in `gait-min`, `repl::driver::run_named_workflow`
# needs a `repl::skill.rs`-style extraction into a `rich-tui`-independent
# module first, gated on `#[cfg(feature = "workflow")]` there instead of
# riding along with `repl::driver`'s `rich-tui` gate.
workflow = ["dep:gait-workflow"]

[[bin]]
name = "mock_brain"
path = "src/bin/mock_brain.rs"
required-features = ["dev-harness"]

# This test captures the real stderr file descriptor, so the default libtest
# output capture must be disabled.
[[test]]
name = "repl_drive_e2e"
path = "tests/repl_drive_e2e.rs"
harness = false
# Drives gait_repl::dev_harness, which only exists under "dev-harness" AND
# "rich-tui" together (it renders through the themed ReplBuilder stack — see
# src/dev_harness.rs and the feature doc comments above). Without both, a
# bare `cargo test -p gait-repl` (or any run over all targets) skips this
# target cleanly instead of failing to resolve the import; naming it
# explicitly via `--test repl_drive_e2e` with an insufficient feature set
# still errors (cargo's behavior for an explicitly-selected target), so drive
# it with `--features "dev-harness,rich-tui"`.
required-features = ["dev-harness", "rich-tui"]

# Companion to repl_drive_e2e above, but for the plain REPL: proves
# gait_repl::plain::run_plain_script_fresh drives a real turn through
# gait_turn_runner::run_turn_source + a real mock_brain process with
# "rich-tui" off. Only needs "dev-harness" (mock_brain's own deps) — no
# raw-fd capture here (plain.rs's writers are already an in-memory buffer),
# so the default libtest harness is fine.
[[test]]
name = "plain_repl_e2e"
path = "tests/plain_repl_e2e.rs"
required-features = ["dev-harness"]
