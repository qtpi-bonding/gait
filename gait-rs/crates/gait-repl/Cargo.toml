[package]
name = "gait-repl"
description = "Interactive REPL frontend for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core = { path = "../.." }
gait-ops = { path = "../gait-ops" }
gait-turn-runner = { path = "../gait-turn-runner" }
gait-workflow = { path = "../gait-workflow", optional = true }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
glob = "0.3"
termimad = "0.34"
termbg = "0.5"
crossterm = "0.29"
syntect = { version = "5.2", default-features = false, features = ["default-themes", "default-syntaxes", "parsing", "regex-fancy"] }
tokio-util = "0.7"
reedline = "0.48"
unicode-width = "0.2"
nu-ansi-term = "0.50"
libc = { version = "0.2", optional = true }
prost = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
git2 = { version = "0.20", optional = true }
gait-testkit = { path = "../gait-testkit", optional = true }

[dev-dependencies]
tempfile = "3"
pbjson-types = "0.7"
serial_test = "3"

[features]
default = ["workflow"]
dev-harness = ["dep:libc", "dep:prost", "dep:serde", "dep:tempfile", "dep:git2", "dep:gait-testkit"]
# `/workflow` REPL command (real YAML DAG runs). Ordinary REPL turns
# (`chat.rs`) no longer need `gait-workflow` at all (Task 3) — only
# `repl::driver::run_named_workflow` does. Default-on so today's full `gait`
# binary is unaffected; a future minimal build can opt out.
#
# TODO(Task 5): this feature only gates the *dependency* today —
# `repl::driver::run_named_workflow` and its `/workflow` command dispatch
# site still reference `gait_workflow::` unconditionally (no
# `#[cfg(feature = "workflow")]` on them yet), so `cargo build -p gait-repl
# --no-default-features` does not compile yet. Gating that call site needs
# the REPL command-table/capability infrastructure Task 4/5 introduces
# (`MIN_REPL_COMMANDS` etc.) — finish the gate there, not before.
workflow = ["dep:gait-workflow"]

[[bin]]
name = "mock_brain"
path = "src/bin/mock_brain.rs"
required-features = ["dev-harness"]

# This test captures the real stderr file descriptor, so the default libtest
# output capture must be disabled.
[[test]]
name = "repl_drive_e2e"
path = "tests/repl_drive_e2e.rs"
harness = false