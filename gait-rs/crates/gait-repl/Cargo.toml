[package]
name = "gait-repl"
description = "Interactive REPL frontend for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gait-core = { path = "../.." }
gait-ops = { path = "../gait-ops" }
gait-workflow = { path = "../gait-workflow" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
glob = "0.3"
termimad = "0.34"
termbg = "0.5"
crossterm = "0.29"
tokio-util = "0.7"
reedline = "0.48"
unicode-width = "0.2"
nu-ansi-term = "0.50"
libc = { version = "0.2", optional = true }
prost = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
git2 = { version = "0.19", optional = true }

[dev-dependencies]
tempfile = "3"
pbjson-types = "0.7"
serial_test = "3"

[features]
dev-harness = ["dep:libc", "dep:prost", "dep:serde", "dep:tempfile", "dep:git2"]