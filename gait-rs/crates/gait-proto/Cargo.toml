[package]
name = "gait-proto"
description = "Protobuf log/state schema and generated types for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost        = "0.13"
prost-types  = "0.13"
prost-reflect = { version = "0.14", features = ["text-format"] }
pbjson       = "0.7"
pbjson-types = "0.7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
sha2         = "0.10"
hex          = "0.4"
uuid          = { version = "1", features = ["v4"] }
serde_jcs    = "0.1"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "c6a5e8da1ccc6500abd9b22171a06f36da5a1da8" }
[build-dependencies]
prost-build         = "0.13"
pbjson-build        = "0.7"
protoc-bin-vendored = "3"
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "c6a5e8da1ccc6500abd9b22171a06f36da5a1da8" }

[dev-dependencies]
tempfile = "3"
