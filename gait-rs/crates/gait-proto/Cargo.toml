[package]
name = "gait-proto"
description = "Protobuf log/state schema and generated types for gait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost        = "0.13"
prost-types  = "0.13"
pbjson       = "0.7"
pbjson-types = "0.7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
sha2         = "0.10"
hex          = "0.4"
uuid         = { version = "1", features = ["v4"] }
serde_jcs    = "0.1"
identity-crypto = { git = "ssh://git@github-qtpi-bonding-identity-crypto/qtpi-bonding/identity-crypto.git", rev = "f09e99b" }
[build-dependencies]
prost-build         = "0.13"
pbjson-build        = "0.7"
protoc-bin-vendored = "3"
identity-crypto = { git = "ssh://git@github-qtpi-bonding-identity-crypto/qtpi-bonding/identity-crypto.git", rev = "f09e99b" }

[dev-dependencies]
tempfile = "3"
