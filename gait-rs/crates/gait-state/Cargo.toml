[package]
name = "gait-state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784" }
message-attestation = { git = "https://github.com/qtpi-bonding/message-attestation.git", rev = "2c7f1ff037aa02c2e850a7aa4d7422304d139737" }
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d" }
concord-telemetry = { git = "https://github.com/qtpi-bonding/concord-telemetry.git", rev = "1c95b776ca932cff59fd24de23a8700c3ae8b4aa", optional = true }
gait-proto    = { path = "../gait-proto" }
gait-identity = { path = "../gait-identity" }
gait-types    = { path = "../gait-types" }
gait-sandbox  = { path = "../gait-sandbox" }   # session/daemons.rs: process::proc_start_time
gait-provider = { path = "../gait-provider" }  # auth.rs / models_meta.rs: providers::lookup
gait-auth     = { path = "../gait-auth" }
gait-platform = { path = "../gait-platform" }
git2 = "0.20"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
pbjson-types = "0.7"
prost = "0.13"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
hex = "0.4"

[features]
testing = []
telemetry = ["dep:concord-telemetry"]

[dev-dependencies]
tempfile = "3"
gait-auth = { path = "../gait-auth", features = ["testing"] }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "eeea2904d5bdc976116d94b7ded917009e169784", features = ["testkit"] }
