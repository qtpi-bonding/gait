[package]
name = "gait-state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "be55165013f5d557ecf8e1b1cf784fb3d07e9753" }
gait-proto    = { path = "../gait-proto" }
gait-identity = { path = "../gait-identity" }
gait-types    = { path = "../gait-types" }
gait-sandbox  = { path = "../gait-sandbox" }   # session/daemons.rs: process::proc_start_time
gait-provider = { path = "../gait-provider" }  # auth.rs / models_meta.rs: providers::lookup
gait-auth     = { path = "../gait-auth" }
gait-platform = { path = "../gait-platform" }
git2 = "0.20"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
pbjson-types = "0.7"
prost = "0.13"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
hex = "0.4"

[features]
testing = []

[dev-dependencies]
tempfile = "3"
gait-auth = { path = "../gait-auth", features = ["testing"] }
identity-crypto = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "c6a5e8da1ccc6500abd9b22171a06f36da5a1da8" }
identity-keyfile = { git = "https://github.com/qtpi-bonding/identity-crypto.git", rev = "c6a5e8da1ccc6500abd9b22171a06f36da5a1da8", features = ["testkit"] }
