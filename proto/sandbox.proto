syntax = "proto3";

package gait.sandbox.v1;

import "google/protobuf/struct.proto";
import "log.proto";

// Sent brain→hand: one tool invocation request.
// Spine-supplied editor buffer for a delegated fs op. Present ⇒ delegated mode.
message Prefetch {
  string path = 1;
  optional string content = 2;  // absent = new file (delegate returned Ok(None))
}
message Impulse {
  reserved 3; // was `cwd` — removed; each `shell` call resolves its own cwd,
              // nothing folds a session-wide "active cwd" into this IPC anymore.
  string tool = 1;
  google.protobuf.Struct args = 2;
  Scope requested = 4;
  optional Prefetch prefetch = 5;
  // Shell-only: the sandbox.shell_whitelist pattern strings in effect for
  // this call, so the hand can build a coaching hint on a network denial
  // without needing the full SandboxConfig (which it deliberately never
  // sees). Empty for non-shell tools.
  repeated string shell_whitelist_patterns = 6;
}

// Sent hand→brain: one tool invocation response.
message Feedback {
  google.protobuf.Value result = 1;
  repeated gait.log.v1.Event events = 2;
  optional gait.log.v1.SandboxUnlockItem denied = 3;  // set when the hand signals a seal denial (Phase 2c)
  optional DaemonRecordProto daemon = 5;        // set when the hand spawned a background daemon
  optional string final_content = 6;  // delegated write/edit: tool's final file content
  repeated gait.log.v1.SandboxWhitelistMatchItem whitelist_match_items = 7;
  optional gait.log.v1.SandboxDenied sandbox_denied = 8;
}

// Metadata for a daemon spawned by the shell tool (detached=true).
// Carried from hand → spine via Feedback so the spine (sole gait-dir writer)
// can append a DaemonStart entry to daemons.jsonl.
message DaemonRecordProto {
  string name       = 1;
  int32  pid        = 2;
  int32  pgid       = 3;
  uint64 started_at = 4;
  string cmd        = 5;
  string cwd        = 6;
  string log_path   = 7;
  string session    = 8;  // owning session id — which parent to notify/wake on exit
}

// Hand → spine reply: the single response a hand emits on stdout for one
// Impulse, whether the tool ran or the hand itself failed. Replaces the old
// "Feedback on success / exit-code on failure" split.
message HandResponse {
  oneof outcome {
    Feedback  feedback = 1;   // the tool ran (result + events + denied)
    HandError error    = 2;   // the hand could not run the tool
  }
}

message HandError {
  string message = 1;
}

// Capability scope for one tool call.
message Scope {
  bool read_all = 1;
  repeated string readable = 2;
  repeated string writable = 3;
  NetworkScope network = 4;
  // Whether the sandboxed process may bind() a local loopback port (e.g. a
  // test runner's VM-service/HTTP server). Independent of `network` — binding
  // loopback grants no reach beyond the local machine, so it's a separate
  // Seatbelt operation (network-bind) gated on its own, not folded into a
  // NetworkScope mode.
  bool local_bind = 5;
  // Exact subpaths and glob patterns denied within an otherwise-granted read
  // scope. Applies to reads, metadata/stat, and unlink — a denied path is
  // indistinguishable from a missing one. A hard floor: the hand always
  // sources this from its own local SandboxConfig, never from the wire —
  // see build_scope_from_impulse. Not part of the unlock-reply grant surface.
  DenyPolicy read_deny = 6;
  // Same as read_deny, for the write scope.
  DenyPolicy write_deny = 7;
}

message DenyPolicy {
  repeated string subpaths = 1;
  repeated string globs = 2;
}

message NetworkScope {
  enum Mode {
    DENY = 0;
    HOSTS = 1;
    ALL = 2;
  }
  Mode mode = 1;
  repeated string hosts = 2;
}

// Framing envelope for the brain↔spine Nerve channel (Phase 3).
// Transported as length-prefixed binary protobuf over a turn-scoped pipe.
// Wire format: [version: u8][len: u32 BE][Signal proto bytes].
message Signal {
  uint64 corr_id = 1;
  oneof body {
    Impulse impulse = 2;
    Feedback feedback = 3;
    Spawn spawn = 4;
    Append append = 5;
    Terminated terminated = 6;
    StreamForward stream_forward = 7;
    Notify notify = 8;
    BrainInit brain_init = 9;          // spine→brain: first frame, replaces startup+log+git disk reads
    Diagnostic diagnostic = 10;        // brain→spine: a diagnostic.jsonl record (JSON string)
  }
}

// Brain → spine: launch a child gait process (spawn_agent delegation).
message Spawn {
  repeated string argv = 1;
  bool detached = 2;
}

// Brain → spine: persist one log event (spine is sole gait-dir writer).
// The spine mints seq/parents and appends to sessions/<id>/log.jsonl.
message Append {
  gait.log.v1.Event event = 1;
}

// Brain → spine: the turn is complete.
// Spine writes run_result_json to stdout and exits with the appropriate code.
message Terminated {
  string run_result_json = 1;
  bool failed = 2;
}

// Brain → spine: forward one live-stream item for REPL/TUI rendering.
// The REPL spine receives these and calls sink.item() so ReplBuilder renders
// in real-time. BrainSink does NOT render locally when StreamForward is active.
message StreamForward {
  gait.log.v1.StreamItem item = 1;
}

// Brain → spine: write an agent_update event to a parent session and resume it.
// Spine acquires the parent's session lock, appends the event, commits, and
// releases. The following Spawn signal triggers the actual child-resume spawn.
message Notify {
  string target_session = 1;
  string from_session   = 2;
  string status         = 3;
  string summary        = 4;
  // Stable idempotency key (see Completion, gait-state::session::completion) —
  // sourced from the ending session's own log-tail event id.
  string idempotency_key = 5;
}

// Spine → brain: the first signal, sent immediately after the brain starts and
// before the relay loop. Carries everything the brain would otherwise read from
// disk at startup: config, the full session log (events), and the turn's git
// snapshot. The brain reads this raw before start_nerve takes stdin.
// Live-status snapshot of one daemon entry from the gait-dir-level registry.
message DaemonStatus {
  string name     = 1;
  int32  pid      = 2;
  bool   alive    = 3;
  string log_path = 4;
}

message BrainInit {
  string config_json = 1;                  // serialized gait_core::config::Config (JSON)
  repeated gait.log.v1.Event events = 2;   // full session log (includes this turn's user input + SessionStart)
  GitStatus git = 3;                       // turn-start codebase git snapshot
  string profile_json = 4;                 // serialized gait_core::profile::Profile (JSON)
  repeated DaemonStatus daemons = 5;       // active daemons in this gait-dir (global registry, shared across sessions)
  // Private spine→brain bootstrap material. Never written to session events,
  // diagnostics, or the process environment.
  string credential_json = 6;
}

message GitStatus {
  string head_hash = 1;
  repeated string dirty_files = 2;
}

// Brain → spine: one diagnostic record. Carried as a JSON string (DiagRecord).
// Routed to sessions/<id>/diagnostic.jsonl when GAIT_DEBUG is set; ALWAYS used
// to drive the spine liveness watchdog. NEVER an event, never folded by retrace.
message Diagnostic {
  string record_json = 1;   // serialized diagnostic::DiagRecord
  string phase       = 2;   // snake_case phase, for the watchdog without parsing record_json
  uint64 elapsed_ms  = 3;   // phase elapsed, for the watchdog
}
