syntax = "proto3";

package gait.sandbox.v1;

import "google/protobuf/struct.proto";
import "log.proto";

// Sent brain→hand: one tool invocation request.
message Impulse {
  string tool = 1;
  google.protobuf.Struct args = 2;
  string cwd = 3;
  Scope requested = 4;
}

// Sent hand→brain: one tool invocation response.
message Feedback {
  google.protobuf.Value result = 1;
  repeated gait.log.v1.Event events = 2;
  optional gait.log.v1.UnlockItem denied = 3;  // set when the hand signals a seal denial (Phase 2c)
  optional DaemonRecordProto daemon = 5;        // set when the hand spawned a background daemon
}

// Metadata for a daemon spawned by the shell tool (detached=true).
// Carried from hand → spine via Feedback so the spine (sole gait-dir writer)
// can append a DaemonStart entry to daemons.jsonl.
message DaemonRecordProto {
  string name       = 1;
  int32  pid        = 2;
  int32  pgid       = 3;
  uint64 started_at = 4;
  string cmd        = 5;
  string cwd        = 6;
  string log_path   = 7;
}

// Hand → spine reply: the single response a hand emits on stdout for one
// Impulse, whether the tool ran or the hand itself failed. Replaces the old
// "Feedback on success / exit-code on failure" split.
message HandResponse {
  oneof outcome {
    Feedback  feedback = 1;   // the tool ran (result + events + denied)
    HandError error    = 2;   // the hand could not run the tool
  }
}

message HandError {
  string message = 1;
}

// Capability scope for one tool call.
message Scope {
  bool read_all = 1;
  repeated string readable = 2;
  repeated string writable = 3;
  NetworkScope network = 4;
}

message NetworkScope {
  enum Mode {
    DENY = 0;
    HOSTS = 1;
    ALL = 2;
  }
  Mode mode = 1;
  repeated string hosts = 2;
}

// Framing envelope for the brain↔spine Nerve channel (Phase 3).
// Transported as length-prefixed binary protobuf over a turn-scoped pipe.
// Wire format: [version: u8][len: u32 BE][Signal proto bytes].
message Signal {
  uint64 corr_id = 1;
  oneof body {
    Impulse impulse = 2;
    Feedback feedback = 3;
    Spawn spawn = 4;
    Append append = 5;
    Terminated terminated = 6;
    StreamForward stream_forward = 7;
    Notify notify = 8;
    BrainInit brain_init = 9;          // spine→brain: first frame, replaces startup+log+git disk reads
  }
}

// Brain → spine: launch a child gait process (spawn_agent delegation).
message Spawn {
  repeated string argv = 1;
}

// Brain → spine: persist one log event (spine is sole gait-dir writer).
// The spine mints seq/parents and appends to sessions/<id>/log.jsonl.
message Append {
  gait.log.v1.Event event = 1;
}

// Brain → spine: the turn is complete.
// Spine writes run_result_json to stdout and exits with the appropriate code.
message Terminated {
  string run_result_json = 1;
  bool failed = 2;
}

// Brain → spine: forward one live-stream item for REPL/TUI rendering.
// The REPL spine receives these and calls sink.item() so ReplBuilder renders
// in real-time. BrainSink does NOT render locally when StreamForward is active.
message StreamForward {
  gait.log.v1.StreamItem item = 1;
}

// Brain → spine: write an agent_update event to a parent session and resume it.
// Spine acquires the parent's session lock, appends the event, commits, and
// releases. The following Spawn signal triggers the actual child-resume spawn.
message Notify {
  string target_session = 1;
  string from_session   = 2;
  string status         = 3;
  string summary        = 4;
}

// Spine → brain: the first signal, sent immediately after the brain starts and
// before the relay loop. Carries everything the brain would otherwise read from
// disk at startup: config, the full session log (events), and the turn's git
// snapshot. The brain reads this raw before start_nerve takes stdin.
message BrainInit {
  string config_json = 1;                  // serialized gait_core::config::Config (JSON)
  repeated gait.log.v1.Event events = 2;   // full session log (includes this turn's user input + SessionStart)
  GitStatus git = 3;                       // turn-start codebase git snapshot
  string profile_json = 4;                 // serialized gait_core::profile::Profile (JSON)
}

message GitStatus {
  string head_hash = 1;
  repeated string dirty_files = 2;
}
