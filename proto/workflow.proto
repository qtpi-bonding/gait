syntax = "proto3";

package gait.workflow.v1;

// ============================================================================
// gait workflow run log — append-only event stream for a script workflow run.
//
//   * One WorkflowEvent per line in workflow-runs/{run_id}/log.jsonl.
//   * JSON on the wire (pbjson, camelCase) — same pattern as gait.log.v1.
//   * Single-writer, append-only. State is reconstructed by replaying events.
//   * Each node turn is a full gait session; this log ties them together.
// ============================================================================

message WorkflowEvent {
  uint32 version = 1;  // format generation; increment on breaking schema changes
  uint64 ts      = 2;  // wall-clock ms

  // Envelope — mirrors gait.log.v1 Event (own schema; not merged into log.proto).
  string          id           = 11;  // UUIDv4 identity
  uint64          seq          = 12;  // Lamport clock = prev.seq + 1
  string          content_hash = 13;  // SHA-256(JCS(kind arm)); recorded, not verified on read
  repeated string parents      = 14;  // [] root · [prev.id] linear

  oneof kind {
    WorkflowStart    workflow_start    = 3;
    NodeStart        node_start        = 4;
    NodeComplete     node_complete     = 5;
    NodeError        node_error        = 6;
    WorkflowGate     workflow_gate     = 8;
    WorkflowComplete workflow_complete = 9;
    WorkflowError    workflow_error    = 10;
    WorkflowHookRun  hook_run          = 15;
  }
  reserved 7;
  reserved "node_skip";
}

message WorkflowStart {
  string          run_id    = 1;  // e.g. "analyze-pr-20260616-143022"
  string          workflow  = 2;  // workflow name from the script
  repeated string args      = 4;  // CLI args passed to the run
  string          script_path   = 6;  // JS workflow script path
  string          script_sha256 = 7;  // sha256 hex of the script
  string          script_source = 8;  // script source text at run time
  reserved 3, 5;
  reserved "yaml_path", "def";
}

// Explicit evidence probes. These are not workflow nodes and are not automatic
// tooling discovery; the workflow's node result remains the source of success.
message RecordConfig {
  repeated RecordCommand commands = 1;
}

message RecordCommand {
  string id         = 1;
  string command    = 2;
  uint64 timeout_ms = 3;
}

message NodeStart {
  string node_id    = 1;
  string node_type  = 2;  // script step kind: "shell" | "turn" | "gate" | "now" | "random"
  uint32 attempt    = 3;  // 1-based; >1 on retries
  string session_id = 4;  // gait session ID for this node's turn (empty for shell-only nodes)
  reserved 5;
  reserved "interactive";
}

message NodeComplete {
  string node_id    = 1;
  string session_id = 2;
  string output     = 3;  // captured stdout / agent output() text
  optional int32 exit_code  = 4;  // set for shell nodes
  string json_output         = 5;  // JSON string; empty if none
  reserved 6;
  reserved "routed_to";
}

message NodeError {
  string node_id = 1;
  string error   = 2;
  uint32 attempt = 3;
  NodeErrorKind kind = 4;  // how the node ended; FAILED is the default
}

// Terminal disposition of a node turn. FAILED is the proto3 default so old
// log lines without `kind` parse as failures.
enum NodeErrorKind {
  NODE_ERROR_KIND_FAILED     = 0;
  NODE_ERROR_KIND_CONTINUED  = 1;
  NODE_ERROR_KIND_CANCELLED  = 2;
}

message WorkflowGate {
  string node_id = 1;
  string message = 2;
}

message WorkflowComplete {
  string run_id = 1;
}

message WorkflowError {
  string run_id     = 1;
  string failed_node = 2;
  string error      = 3;
}

message WorkflowHookRun {
  string node_id   = 1;
  string hook_type = 2;  // "before" | "after" | "error"
  string command   = 3;
  int32  exit_code = 4;
}
