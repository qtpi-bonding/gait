syntax = "proto3";

package gait.log.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";

// ============================================================================
// gait event log — the system worldline.
//
//   * Append-only, CRDT-shaped: a grow-only set of immutable events + LWW-per-
//     target mutations. The fold (Retrace) is a pure function of the event SET
//     ordered by (seq, id), so merged/rebased/resynced logs converge.
//   * Content-addressed: every event carries a UUID identity + a content hash.
//   * JSON on the wire (proto3 canonical / pbjson, camelCase). Each line of
//     transcript.jsonl is exactly one Event.
//
// proto is the SOURCE OF TRUTH for the log format (generated Rust replaces the
// hand-written AnyEvent). Field numbers only matter for schema identity here —
// the wire is JSON, not binary proto. See
// docs/superpowers/specs/2026-06-10-proto-log-schema-design.md.
// ============================================================================


// ── Envelope ────────────────────────────────────────────────────────────────
// Every log line is an Event. Fields 1–6 are universal; the body (16–18) is
// either a substantive Payload or a mutation operating on a prior event.
message Event {
  uint32 version          = 1;  // format generation; selects decode + hash scheme. Metadata.
  string id               = 2;  // UUIDv4 — identity (dedup + LWW tiebreak). CRDT key = (seq, id).
  uint64 seq              = 3;  // Lamport clock = max(parents.seq)+1 — THE order key.
  uint64 ts               = 4;  // wall-clock ms — display/metadata only, never ordering.
  string content_hash     = 5;  // hash(JCS(body)) — integrity; recorded at creation, recompute-to-verify.
  repeated string parents = 6;  // causal DAG: [] root · [prev] linear · [a,b] merge. Populated now; folded later.

  reserved 7 to 15;             // future envelope fields (origin/writer-id, Merkle prev-hash)

  // NOTE: an unset `body` is a malformed event — the Retrace MUST reject body==None as a hard error
  // (proto3 cannot enforce "exactly one oneof arm set").
  oneof body {
    Payload payload = 16;       // a substantive event ("what happened")
    Redact  redact  = 17;       // a mutation: remove a prior event from the working Transcript
    Replace replace = 18;       // a mutation: rewrite a prior event with a fully-typed payload
  }
}


// ── Live-stream types (ephemeral, never persisted) ───────────────────────────

// Ephemeral live-typing fragment. NOT a log event — no envelope, never persisted.
message TextDelta {
  string content = 1;
}

// Live-stream envelope. Carries either a durable log Event or an ephemeral
// TextDelta. Never persisted; produced+consumed within a single session.
message StreamItem {
  oneof item {
    Event     event = 1;
    TextDelta delta = 2;
  }
}


// ── Payload: the substantive worldline events ────────────────────────────────
// Reused by Event.body AND by Replace.replacement, so a Replace is fully typed.
// Contains ONLY substantive events (no mutations) — that prevents Replace-of-a-
// Replace recursion.
message Payload {
  oneof kind {
    SessionStart       session_start       = 1;
    Agent              agent               = 2;
    UserTurn           user_turn           = 3;
    AssistantText      assistant_text      = 4;
    ToolCall           tool_call           = 5;
    ToolResult         tool_result         = 6;
    Clarify            clarify             = 7;
    ClarifyReply       clarify_reply       = 8;
    ClarifyConvergence clarify_convergence = 9;
    Inform             inform              = 10;
    InformReply        inform_reply        = 11;
    InformConvergence  inform_convergence  = 12;
    Permissions        permissions         = 13;
    PermissionsReply   permissions_reply   = 14;
    AgentUpdate        agent_update        = 15;
    TurnComplete       turn_complete       = 16;
    Summary            summary             = 17;
    Error              error               = 18;
    RawEvent           raw                 = 19;  // opaque holder: legacy / not-yet-modeled events (incl. workflow today)
    SandboxApplied     sandbox_applied     = 50;
    HookRun         hook_run            = 51;
    Cwd                cwd                 = 52;
    Toggle      toggle       = 53;
    ModelChange model_change = 54;

  }
  reserved 20 to 49;  // workflow family (WorkflowHook* / WorkflowNode* / WorkflowStart …) — deferred to the workflow-subsystem redo
}

// working-directory change; ActiveCwd LWW-folds to the last one
message Cwd { string path = 1; }

// capability enable/disable delta — OR-Set per kind; folded by ActiveAgent.
enum ToggleKind {
  TOGGLE_KIND_UNSPECIFIED = 0;
  TOGGLE_KIND_SKILL       = 1;
  TOGGLE_KIND_MCP         = 2;
  TOGGLE_KIND_TOOL        = 3;
}
message Toggle {
  ToggleKind kind    = 1;
  string     name    = 2;
  bool       enabled = 3;
}
// model-swap delta — LWW-Register; folded by ActiveAgent.
message ModelChange { string model = 1; }




// ── Mutations ────────────────────────────────────────────────────────────────
message Redact {
  string target = 1;            // envelope id of the event to remove from the working Transcript
  optional string reason = 2;
}
message Replace {
  string  target      = 1;      // envelope id of the event to rewrite
  Payload replacement = 2;      // a fully-typed new payload (same-type by convention; validated in code)
  optional string reason = 3;
}


// ── Opaque catch-all ─────────────────────────────────────────────────────────
// Keeps logs fully decodable across legacy/unmodeled events (incl. current
// workflow events) until they get real messages.
message RawEvent {
  string type                    = 1;  // original event tag (e.g. "node_start")
  google.protobuf.Struct payload = 2;  // original JSON body, verbatim
}


// ── Reusable value objects ───────────────────────────────────────────────────
message CodebaseState {               // environment-worldline stamp (working-tree state)
  string hash                 = 1;
  bool   dirty                = 2;
  repeated string dirty_files = 3;
}
message PermissionPolicy { repeated string allow = 1; repeated string deny = 2; }
message TurnUsage  { uint64 input = 1; uint64 output = 2; uint64 cache_read = 3; uint64 cache_write = 4; }
message TurnOutput { string message = 1; google.protobuf.Value result = 2; }   // result: any JSON shape
message CompactionUsage { uint64 input = 1; uint64 output = 2; }
message ProcessResult   { int32 exit_code = 1; bool timed_out = 2; }
message ConvergenceItem { string id = 1; string proposal = 2; optional string response = 3; bool consistent = 4; }


// ── Core conversation ────────────────────────────────────────────────────────
message SessionStart {                // root event — identity ONLY
  string session_id           = 1;
  optional string assigned_by = 2;
}

message Agent {                       // the live agent config from this seq forward; first instance = opening.
  string model                 = 1;   // LWW-projected (LWW-Register). "provider/model-id".
  string instructions          = 2;   // composed system prompt — FULL (replay-complete). Re-emitted whole on any drift.
  repeated string tools        = 3;   // resolved tool names
  repeated string mcp_servers  = 4;
  repeated string skills       = 5;
  PermissionPolicy permissions = 6;
  uint64 through_seq           = 7;   // audit: seq of the last event this config was derived from
}

message UserTurn {
  string content                 = 1;
  optional string from           = 2;  // sender id (open → string)
  CodebaseState codebase         = 3;  // env-worldline stamp
  repeated string injected_files = 4;  // files pulled into context this turn
}

message AssistantText { string content = 1; }

message ToolCall {
  string call_id               = 1;    // correlation id (cascade + ToolResult pairing match on this)
  string name                  = 2;
  google.protobuf.Struct input = 3;    // tool args — always a JSON object
}
message ToolResult {
  string call_id                    = 1;
  string output                     = 2;
  google.protobuf.Duration duration = 3;  // generic — every tool; JSON "0.123s"
  ProcessResult process             = 4;  // present only for shell/process tools
}

message TurnComplete {
  TurnUsage     usage        = 1;
  CodebaseState codebase     = 2;
  optional string checkpoint = 3;      // shadow-git SHA (environment snapshot handle)
  repeated string blocks     = 4;      // numbered render blocks (quote-reply UI)
  TurnOutput    output       = 5;
}

message Summary {
  string summary        = 1;
  uint32 turns_covered  = 2;
  CompactionUsage usage = 3;
  optional uint64 through_seq = 4;      // seq boundary it compacts through (the fold coordinate); unset = none
}

message Error {
  string     message = 1;
  ErrorPhase phase   = 2;
}
enum ErrorPhase {
  ERROR_PHASE_UNSPECIFIED = 0;
  ERROR_PHASE_LLM         = 1;
  ERROR_PHASE_TOOL        = 2;
  ERROR_PHASE_GIT         = 3;
  ERROR_PHASE_INIT        = 4;
}


// ── Dialogue ─────────────────────────────────────────────────────────────────
message ClarifyItem {
  string id        = 1;                // correlation slug — links request↔reply↔convergence
  string content   = 2;                // the question
  string why       = 3;                // what changes based on the answer
  ClarifyKind kind = 4;
}
enum ClarifyKind {
  CLARIFY_KIND_UNSPECIFIED = 0;
  CLARIFY_KIND_IS          = 1;        // factual
  CLARIFY_KIND_OUGHT       = 2;        // judgment/preference
}
message ClarifyReplyItem { string id = 1; string content = 2; optional string reasoning = 3; }
message InformItem       { string id = 1; string content = 2; optional string context = 3; }
message InformReplyItem  { string id = 1; string content = 2; }

message Clarify            { repeated ClarifyItem      items = 1; }
message ClarifyReply       { repeated ClarifyReplyItem items = 1; }
message ClarifyConvergence { repeated ConvergenceItem  items = 1; }
message Inform             { repeated InformItem       items = 1; }
message InformReply        { repeated InformReplyItem  items = 1; }
message InformConvergence  { repeated ConvergenceItem  items = 1; }

message AgentUpdate {
  string session_id = 1;               // cross-agent reference — names ANOTHER session (the one exception)
  AgentStatus status = 2;
  string summary = 3;
  google.protobuf.Value items = 4;     // any JSON
}
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_DONE        = 1;
  AGENT_STATUS_CLARIFY     = 2;
  AGENT_STATUS_INFORM      = 3;
}

message PermissionItem {
  string id        = 1;
  string cmd       = 2;
  string reason    = 3;
  repeated string patterns = 4;        // allow-list entries, broad → specific
  string tool_name = 5;
  google.protobuf.Struct tool_args = 6;
}
message PermissionsReplyItem {
  string id            = 1;
  Decision decision    = 2;
  optional string text = 3;
  Scope scope          = 4;            // legacy null → SCOPE_UNSPECIFIED
}
enum Decision { DECISION_UNSPECIFIED = 0; DECISION_APPROVE = 1; DECISION_DENY = 2; }
enum Scope    { SCOPE_UNSPECIFIED = 0; SCOPE_ONCE = 1; SCOPE_AGENT = 2; SCOPE_GLOBAL = 3; SCOPE_SESSION = 4; }
message Permissions      { repeated PermissionItem items = 1; }
message PermissionsReply { string from = 1; repeated PermissionsReplyItem items = 2; }  // from = replier id


// ── Sandbox ──────────────────────────────────────────────────────────────────
message SandboxApplied {
  SandboxEnforcement enforcement = 1;  // active kernel enforcement or fallback
  repeated string scope_paths    = 2;  // the enforcement scope paths
  optional string reason         = 3;  // why enforcement is unavailable (enforcement=UNAVAILABLE)
}
enum SandboxEnforcement {
  SANDBOX_ENFORCEMENT_UNSPECIFIED = 0;
  SANDBOX_ENFORCEMENT_ACTIVE      = 1;  // Landlock (Linux) or Seatbelt (macOS) applied
  SANDBOX_ENFORCEMENT_UNAVAILABLE = 2;  // kernel enforcement unavailable; tier-0 gate still active
  SANDBOX_ENFORCEMENT_NOOP        = 3;  // no scope declared or explicitly disabled (tests/unscoped)
}


// ── Hooks ────────────────────────────────────────────────────────────────────
// Emitted by config-driven hooks (gait.jsonc "hooks": [...]).
// Workflow-subsystem hook events are WorkflowHook* in the reserved 20-49 range.
message HookRun {
  HookPhase phase      = 1;  // lifecycle point where this hook fired
  string    command    = 2;  // the shell command string
  int32     exit_code  = 3;  // 0 = pass; non-zero = hook reported failure
  string    output     = 4;  // combined stdout+stderr from the command
  optional string call_id = 5;  // ToolCall correlation (post_tool / pre_tool only)
}
enum HookPhase {
  HOOK_PHASE_UNSPECIFIED = 0;
  HOOK_PHASE_POST_TOOL   = 1;
  HOOK_PHASE_PRE_TOOL    = 2;
  HOOK_PHASE_POST_TURN   = 3;
  HOOK_PHASE_PRE_TURN    = 4;
}



// ── Projections live in their own contract ───────────────────────────────────
// `SessionState` / `gait state` output is NOT part of the log vocabulary. It has
// its own package + envelope in `proto/state.proto` (gait.state.v1), which imports
// this file and references the item types above. Split so the state-query API and
// the log format evolve independently.
