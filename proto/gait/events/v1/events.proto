syntax = "proto3";

package gait.events.v1;

import "concord_telemetry/v1/principal.proto";

enum PromptSource {
  PROMPT_SOURCE_UNSPECIFIED = 0;
  PROMPT_SOURCE_DIRECT = 1;
  PROMPT_SOURCE_ATTESTED = 2;
}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_DONE = 1;
  TURN_OUTCOME_CLARIFY = 2;
  TURN_OUTCOME_INFORM = 3;
  TURN_OUTCOME_PERMISSIONS = 4;
  TURN_OUTCOME_SANDBOX_UNLOCK = 5;
  TURN_OUTCOME_CANCELLED = 6;
  TURN_OUTCOME_FAILED = 7;
}

enum NotifyOutcome {
  NOTIFY_OUTCOME_UNSPECIFIED = 0;
  NOTIFY_OUTCOME_WOKE = 1;
  NOTIFY_OUTCOME_BUSY = 2;
  NOTIFY_OUTCOME_ALREADY_SURFACED = 3;
  NOTIFY_OUTCOME_NO_PARENT = 4;
}

message PromptAccepted {
  string source_record_id = 1;
  string session_id = 2;
  uint32 message_count = 3;
  repeated string message_ids = 4;
  PromptSource source = 5;
  concord_telemetry.v1.Principal author = 6;
}

message TurnCompleted {
  string source_record_id = 1;
  string session_id = 2;
  TurnOutcome outcome = 3;
  uint64 elapsed_ms = 4;          // active time: waits for permission are excluded
  uint64 started_ms = 5;          // the turn's start; its end is this event's own timestamp
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
  uint64 cache_read_tokens = 8;
  uint64 cache_write_tokens = 9;
  string model = 10;              // "provider/model-id" the turn ran on
  string turn_id = 11;
}

message AgentSpawned {
  string source_record_id = 1;
  string session_id = 2;
  string child_session_id = 3;
  string agent_name = 4;
}

message AgentReported {
  string source_record_id = 1;
  string parent_session_id = 2;
  string child_session_id = 3;
  string status = 4;
  bool signed = 5;
  NotifyOutcome outcome = 6;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  PERMISSION_DECISION_DENY = 2;
  PERMISSION_DECISION_SANDBOX_UNLOCK = 3;
}

enum GrantScope {
  GRANT_SCOPE_UNSPECIFIED = 0;
  GRANT_SCOPE_ONCE = 1;
  GRANT_SCOPE_SESSION = 2;
  GRANT_SCOPE_MODE = 3;
  GRANT_SCOPE_AGENT = 4;
  GRANT_SCOPE_GLOBAL = 5;
}

message PermissionDecided {
  string source_record_id = 1;
  string session_id = 2;
  PermissionDecision decision = 3;
  GrantScope scope = 4;
  uint32 item_count = 5;
  bool persisted = 6;
}

enum Disposition {
  DISPOSITION_UNSPECIFIED = 0;
  DISPOSITION_PERSISTED = 1;
  DISPOSITION_DISCARDED = 2;
}

message SessionDisposed {
  string source_record_id = 1;
  string session_id = 2;
  Disposition disposition = 3;
}

// The process lifecycle of a long-running gait service (gait-acp). The service
// name is the resource's service.name. An idle seat and a dead seat look the
// same without these: ServiceAlive is the only way to tell them apart.
message ServiceStarted {
  string source_record_id = 1;  // this process run: "<service>:<pid>:<start_ms>"
  string version = 2;
}

message ServiceStopping {
  string source_record_id = 1;
  string reason = 2;  // "signal" | "input_closed" | "error"
}

message ServiceAlive {
  string source_record_id = 1;
  uint64 uptime_ms = 2;
}

enum ModelFailureKind {
  MODEL_FAILURE_KIND_UNSPECIFIED = 0;
  MODEL_FAILURE_KIND_HTTP_STATUS = 1;
  MODEL_FAILURE_KIND_TIMEOUT_CONNECT = 2;
  MODEL_FAILURE_KIND_TIMEOUT_TTFB = 3;
  MODEL_FAILURE_KIND_TIMEOUT_IDLE = 4;
  MODEL_FAILURE_KIND_TIMEOUT_ABSOLUTE = 5;
  MODEL_FAILURE_KIND_OVERLOADED = 6;
  MODEL_FAILURE_KIND_TRANSPORT = 7;
}

// One per failed model-call attempt, the last one included. A turn that hit two
// 429s and then succeeded emits two of these with will_retry = true; the final
// failure also reaches the turn's coded error record.
message ModelCallFailed {
  string source_record_id = 1;  // "<session_id>:<turn_id>:<n>", n counts failures in the process
  string session_id = 2;
  string turn_id = 3;
  string model = 4;             // "provider/model-id"
  uint32 attempt = 5;           // 1-based
  uint32 max_attempts = 6;
  ModelFailureKind kind = 7;
  uint32 http_status = 8;       // 0 when the failure was not an HTTP status
  uint64 retry_after_ms = 9;    // the server's Retry-After; 0 when it sent none
  string request_id = 10;       // the provider's x-request-id; empty when none
  bool will_retry = 11;
}

// A turn paused for permission. Pairs with the next PermissionDecided of the
// session, so a monitor can measure how long a seat sat blocked. No
// command or tool text: only how many items are waiting.
message PermissionRequested {
  string source_record_id = 1;  // the id of the logged permissions request
  string session_id = 2;
  uint32 item_count = 3;
}

// The spine started a brain subprocess for a turn.
message BrainSpawned {
  string source_record_id = 1;  // "<session_id>:<turn_id>"
  string session_id = 2;
  string turn_id = 3;
  uint32 pid = 4;
}

// The brain is gone. finalized = false means it died, or the spine killed it,
// before it produced a finished turn.
message BrainExited {
  string source_record_id = 1;
  string session_id = 2;
  string turn_id = 3;
  uint32 pid = 4;
  bool finalized = 5;
}

// The sandbox refused a tool call. Names the tool and the dimension that was
// denied (read, write, network ...), never the path, command or host.
message SandboxDenied {
  string source_record_id = 1;  // "<session_id>:<turn_id>:<n>", n counts denials in the process
  string session_id = 2;
  string turn_id = 3;
  string tool = 4;
  string dimension = 5;
}

// The turn paused to ask whether to widen the sandbox.
message SandboxUnlockRequested {
  string source_record_id = 1;  // "<session_id>:<turn_id>"
  string session_id = 2;
  string turn_id = 3;
  uint32 item_count = 4;
}
